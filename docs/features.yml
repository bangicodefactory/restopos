# RestoPOS — implementation ledger
#
# What we have actually built. `docs/spec/02-features.md` is the *parity reference* — 549 rows
# describing what Odoo 19 does — and it deliberately says nothing about our progress. This file is
# the other half of that question, and it is machine-readable so CI can hold it to account.
#
# Checked by `npm run docs:check` (scripts/docs-check.mjs). The rules:
#
#   * every key must be a feature ID that `02-features.md` actually defines. Twenty IDs cited in
#     source docblocks turned out not to exist — mostly range endpoints like "BOF-030 … BOF-079"
#     read as if they were features. An ID nobody validates is an ID that drifts.
#   * `status: shipped` + `surface: user` must name a manual page, or `manual: todo`.
#   * the number of `manual: todo` entries may not exceed `meta.manual_debt`. Write docs, lower the
#     number. Nobody has to document 173 features before the gate can start protecting the next one.
#
# Fields
#   status   shipped | partial | planned      absence of a key means planned
#   surface  user | internal                  internal = no user-visible behaviour, no manual owed
#   manual   <path>#<anchor> | <path> | todo  relative to docs/manual/
#   note     anything a reader of the manual would be misled without
#
# Seeded from feature IDs annotated in source docblocks, which is the honest evidence of what is
# wired up — commit messages name almost none (3 of the first 22 tickets).

meta:
  # Ceiling on undocumented user-facing features. Ratchet: it may fall, never rise.
  manual_debt: 133

