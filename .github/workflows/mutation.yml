name: Mutation

# Mutation testing for the money paths (BAN-509).
#
# A separate workflow from `tests.yml`, with its own triggers, because mutation testing is minutes
# rather than seconds and every PR paying that cost is how a slow check gets deleted. It runs:
#
#   - on a PR that touches the mutated code or the tests that cover it — the only PRs where the
#     answer can change;
#   - nightly, so a drop caused by something outside those paths is still found within a day;
#   - on demand.
#
# The `paths` filter is the load-bearing part of keeping this affordable. It is deliberately wider
# than the mutated directories: a PR that only edits a *test* can lower the score just as surely as
# one that edits the code.

on:
  pull_request:
    paths:
      - 'app/Services/Pos/**'
      - 'app/Support/Money/**'
      - 'app/Support/Pricing/**'
      - 'app/Support/Tax/**'
      - 'app/Support/Pos/**'
      - 'packages/domain/src/**'
      - 'tests/**'
      - 'packages/domain/test/**'
      - 'stryker.config.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    name: Pest --mutate (PHP money paths)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          # The whole point. `tests.yml` runs with `coverage: none`; mutation testing needs to know
          # which test covers which line, or it re-runs the entire suite per mutant.
          coverage: pcov

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate

      # Pest's own mutation testing, not Infection. Infection drives `vendor/bin/phpunit`, which
      # Pest refuses outright ("Please run [./vendor/bin/pest] instead"), and no adapter package
      # bridges the two. Pest 3+ has this built in: no second config file, no extra dependency, and
      # a runner that understands the suite it is mutating. Found by pushing to CI, which is the
      # only place the two could be seen not to fit.
      - name: Run mutation testing
        run: composer mutation

  domain:
    runs-on: ubuntu-latest
    name: Stryker (shared domain)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stryker
        run: npx stryker run

      - name: Upload the survivor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: storage/logs/stryker.json
          if-no-files-found: ignore
