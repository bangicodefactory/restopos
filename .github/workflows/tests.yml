name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # The composer.lock resolves symfony/* v8.1 (platform floor php >= 8.4.1), so 8.4 is the
        # real (and only) supported line — matching composer.json's `php` constraint. See issue #3.
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      # Must precede `composer install`: its post-autoload-dump runs `package:discover`, which
      # boots the app and registers broadcast channels — resolving the reverb broadcaster, which
      # needs REVERB_APP_KEY from the environment (it is set in .env.example).
      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test
