name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # The composer.lock resolves symfony/* v8.1 (platform floor php >= 8.4.1), so 8.4 is the
        # real (and only) supported line — matching composer.json's `php` constraint. See issue #3.
        php: ['8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      # Must precede `composer install`: its post-autoload-dump runs `package:discover`, which
      # boots the app and registers broadcast channels — resolving the reverb broadcaster, which
      # needs REVERB_APP_KEY from the environment (it is set in .env.example).
      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest

    name: Frontend (tsc + eslint + vitest)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm run test

  docs:
    runs-on: ubuntu-latest

    name: Docs (ledger + manual coverage)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The diff gate needs a base to compare against; a shallow clone has no merge-base.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Always: the ledger, the manual and the spec must agree with each other.
      - name: Check the documentation ledger
        run: npm run docs:check

      # On a pull request, also: behaviour that changed must have been documented. The opt-out
      # reaches the script through the environment rather than a flag, so the same script runs
      # locally with no GitHub in the loop.
      - name: Check this change documented itself
        if: github.event_name == 'pull_request'
        env:
          DOCS_SKIP_CONTEXT: ${{ github.event.pull_request.body }}
          DOCS_SKIP_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/docs-check.mjs --since=origin/${{ github.event.pull_request.base.ref }}

      - name: Build the manual
        run: npm run docs:build
