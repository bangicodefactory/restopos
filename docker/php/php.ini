; RestoPOS PHP tuning.
memory_limit = 512M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M

; A sync batch from a register that has been offline all service can carry a few hundred
; orders, each with lines and payments. The default 1000 is not enough.
max_input_vars = 5000

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Money is decimal. bcmath's default scale is only a fallback — the engine always passes an
; explicit scale — but set it high enough that an accidental default cannot round early.
bcmath.scale = 10

date.timezone = UTC
