# RestoPOS — local development stack.
#
# The app container is deliberately thin: it runs PHP-FPM behind nginx and nothing else.
# Queues, the websocket server and the scheduler each get their own container, because in
# production they scale independently and a POS that loses its queue worker must not also
# lose its web tier.
#
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
#   docker compose exec app php artisan pos:pair --config=1     # prints a pairing code
#
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-restopos.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: restopos
      DB_USERNAME: restopos
      DB_PASSWORD: restopos
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_SERVER_HOST: 0.0.0.0

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Websockets. The register, the kitchen display and the self-order app all subscribe here;
  # every one of them degrades to polling if this container is down, so it is not in the
  # critical path for taking money.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: restopos
      DB_USERNAME: restopos
      DB_PASSWORD: restopos
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb

  # Kitchen print jobs and accounting exports run here. `--tries=3` because a print job that
  # fails three times is a paper jam, not a transient error, and should surface to a human.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: restopos
      DB_USERNAME: restopos
      DB_PASSWORD: restopos
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: restopos
      DB_USERNAME: restopos
      DB_PASSWORD: restopos
      REDIS_HOST: redis

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restopos
      POSTGRES_USER: restopos
      POSTGRES_PASSWORD: restopos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restopos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
